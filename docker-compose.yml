services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password 
    secrets:
      - db_password
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - '5432:5432'
volumes:
  postgres:
secrets:
  db_password:
    file: ./secrets/db_password.txt
